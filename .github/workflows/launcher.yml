name: Build and sign launchers
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (major.minor.patch)'
        required: true
        default: '0.6.2'

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build from source
        env:
          LAUNCHER_VERSION: ${{ inputs.version }}
        run: python packaging/build_launcher_exe.py --output unsigned --version "$env:LAUNCHER_VERSION"
      - name: Test launchers
        run: |
          python -m pip install pytest
          python -m pytest tests/test_signpath_launchers.py -q -rs
      - name: Upload unsigned launchers
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: launchers-unsigned
          path: unsigned/*.exe
          if-no-files-found: error
      - name: Check signing configuration
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:SIGNPATH_API_TOKEN) { 'enabled=true' >> $env:GITHUB_OUTPUT }
      # 版ごとの人による承認は SignPath の signing policy で設定する。
      - name: Request SignPath signature
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload signed launchers
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: launchers-signed
          path: signed/*.exe
          if-no-files-found: error
