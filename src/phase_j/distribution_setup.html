<main><img class="app-logo" src="/brand/app_logo.png" width="64" height="72" alt="puyoZeus Live" style="object-fit:contain;float:left;margin:0 18px 12px 0">
<small>EARLY ACCESS</small><h1 data-ja="puyoZeus Live" data-en="puyoZeus Live">puyoZeus Live</h1><p data-ja="配信の準備" data-en="Get ready to stream">配信の準備</p>
<p data-ja="非公式のファン制作ツール。ぷよぷよeスポーツはSEGAの商標です。" data-en="Unofficial fan-made tool. Puyo Puyo Champions is a trademark of SEGA."></p>
<header class="welcome"><h2 data-ja="配信まで、ひとつずつ。" data-en="Get ready, one step at a time."></h2><p data-ja="入力をつなぐ → 表示を選ぶ → OBS に追加。次にすることをここで確認できます。" data-en="Connect your input, choose a layout, then add it to OBS. Find your next step here."></p><nav class="route" aria-label="準備の手順"><a href="#input-step" data-ja="01 入力" data-en="01 Input"></a><a href="#style-step" data-ja="02 見た目" data-en="02 Style"></a><a href="#obs-step" data-ja="03 OBS に追加" data-en="03 Add to OBS"></a></nav></header>
<section id="runtime-card" class="live-card" role="status" aria-live="polite"><small data-ja="いまの状態" data-en="Current status"></small><br><strong id="runtime-title"></strong><p id="runtime-next"></p><button id="retry" type="button" data-ja="入力を確認して再開" data-en="Check input and resume"></button> <button id="stop-setup" type="button" data-ja="アプリを終了" data-en="Quit app"></button></section>
<section class="step"><h2 data-ja="1 · インストール先と言語" data-en="1 · Location and language"></h2><code id="root"></code>
<label><span data-ja="表示言語" data-en="Display language"></span> <select id="language"><option value="auto">OS</option><option value="ja">日本語</option><option value="en">English</option></select></label></section>
<section id="input-step" class="step"><h2 data-ja="2 · 映像の入力" data-en="2 · Video input"></h2>
<p data-ja="OBSの仮想カメラを探します。出力の種類を「ソース」にし、ゲームのキャプチャを選んでください。" data-en="Find the OBS Virtual Camera. Set its output type to Source, and select the game capture."></p>
<button id="scan" data-ja="入力を探す" data-en="Find inputs"></button> <select id="device"></select> <button id="test" data-ja="選んだ入力をテスト" data-en="Test selected input"></button><p id="device-status"></p><img id="input-test" hidden alt="Input test">
<div id="camera-help" class="help" hidden><strong data-ja="見つからないときは" data-en="If the camera is missing"></strong><p data-ja="1. OBS を開き、仮想カメラの歯車で「ソース」→ ゲームのキャプチャを選びます。" data-en="1. Open OBS Virtual Camera settings. Choose Source, then your game capture."></p><p data-ja="2. 「仮想カメラ開始」を押して、この画面の「入力を探す」をもう一度押します。" data-en="2. Start Virtual Camera, then choose Find inputs again."></p><p data-ja="一覧に出ても映らない場合は、仮想カメラを使っているほかのアプリを閉じて再確認してください。" data-en="If it is listed but shows no video, close other apps using the virtual camera and try again."></p></div>
</section><section id="style-step" class="step"><h2 data-ja="3 · 表示の見た目" data-en="3 · Overlay style"></h2>
<div class="row"><div><label><span data-ja="配置" data-en="Layout"></span> <select id="layout"></select></label>
<label>デザイン / Design <select id="theme"></select></label><div id="design-samples" aria-label="デザインの見本"></div>
<label><input type="checkbox" id="mascot"> <span data-ja="ゼウスくんを表示" data-en="Show Zeus-kun"></span></label></div><div class="preset"><iframe id="preset" title="Preset preview"></iframe><small data-ja="図とサンプル値による見本。ゲーム画面は含みません。" data-en="Diagram with sample values. No game footage."></small><small id="preview-placement"></small></div></div></section>
<section class="step"><h2 data-ja="4 · 起動と更新" data-en="4 · Startup and updates"></h2>
<label><input type="checkbox" id="desktop_shortcut"> <span data-ja="デスクトップにショートカット" data-en="Desktop shortcut"></span></label>
<label><input type="checkbox" id="start_menu_shortcut"> <span data-ja="スタートメニューにショートカット" data-en="Start menu shortcut"></span></label>
<label><input type="checkbox" id="autostart"> <span data-ja="Windows起動時に自動起動" data-en="Start with Windows"></span></label>
<label><input type="checkbox" id="check_updates"> <span data-ja="起動時に更新を確認（通知のみ）" data-en="Check for updates at startup (notify only)"></span></label>
<details><summary data-ja="詳細設定" data-en="Advanced settings"></summary>
<label>Port <input id="port" type="number" min="1024" max="65535"></label>
<small data-ja="ポートの変更は次回起動時に反映します。使用中なら空いているポートを選びます。" data-en="Port changes apply on next launch. A free port is selected if the requested port is busy."></small>
<label data-ja="ログ中継URL（HTTPS）" data-en="Log relay URL (HTTPS)"></label><input id="relay_url" type="url" style="width:100%">
<label data-ja="更新一覧URL（HTTPS）" data-en="Release index URL (HTTPS)"></label><input id="releases_url" type="url" style="width:100%"></details></section>
<section id="obs-step" class="step"><h2 data-ja="5 · OBSに追加" data-en="5 · Add to OBS"></h2>
<ol><li data-ja="仮想カメラの歯車を開き、出力の種類を「ソース」、ゲームのキャプチャを出力ソースに指定します。" data-en="Open Virtual Camera settings. Set Output Type to Source and select the game capture."></li>
<li data-ja="仮想カメラを開始します。入力は1920×1080を推奨します。" data-en="Start the Virtual Camera. Recommended input: 1920×1080."></li>
<li data-ja="ブラウザソースを追加し、下のURL、幅1920、高さ1080を設定します。" data-en="Add a Browser source with the URL below, width 1920 and height 1080."></li>
<li data-ja="設定を保存して起動します。画面調整が自動で進み、対戦画面がない間は試合待ちになります。" data-en="Save and start. Calibration runs automatically. The overlay waits when no match is visible."></li></ol>
<input id="url" readonly><button id="copy" data-ja="URLをコピー" data-en="Copy URL"></button> <button id="start" data-ja="保存して起動" data-en="Save and start"></button>
<p id="status" role="status"></p><a href="/" target="_blank" data-ja="表示ページを開く" data-en="Open overlay"></a> · <a href="/settings" data-ja="表示設定・ログを送る" data-en="Display settings / Send logs"></a>
<p data-ja="障害ログの自動送信はありません。内容を確認してから手動で送れます。" data-en="Logs are never sent automatically. Review the report and send it manually."></p></section>
